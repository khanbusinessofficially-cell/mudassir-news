<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mudassir News</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/logo.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A1F3D"><meta name="description" content="Khabar Jahan Hum Wahan">
<script src="/config.js"></script><script src="/i18n.js"></script>
<style>
:root{--bg:#F4F7F5;--card:#fff;--tx:#0A1F3D;--mu:#5A6B7F;--em:#0E9F6E;--em2:#087F58;--gold:#D4AF37;--navy:#0A1F3D;--br:#E1E8E4;--sh:0 2px 10px rgba(10,31,61,.08)}
:root[data-theme=dark]{--bg:#07142A;--card:#0F2342;--tx:#EAF2F0;--mu:#97A8BD;--br:#1E3557;--sh:none;--em:#12B77F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Nastaliq Urdu","Noto Naskh Arabic","Segoe UI",system-ui,Roboto,sans-serif;padding-bottom:calc(66px + env(safe-area-inset-bottom));transition:background .25s}
:lang(ur) body,html[lang=ur] .b h3,html[lang=ur] .chip{line-height:1.9}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .12s,background .15s}button:active{transform:scale(.95)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:2px solid var(--gold)}
header .ic{width:42px;height:42px;border-radius:50%;font-size:22px;color:#fff;flex:none}header .ic:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.brand img{width:40px;height:40px;border-radius:10px}.brand b{font-size:19px;display:block;line-height:1.2}.brand small{display:block;font-size:12px;color:var(--gold);line-height:1.3;margin-top:2px}
.chips{position:sticky;top:61px;z-index:4;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:3px 16px;border-radius:99px;background:var(--card);border:1px solid var(--br);font-size:14px;white-space:nowrap}.chip.on{background:var(--em);border-color:var(--em);color:#fff}
.chip.all{font-weight:700;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.chip.all.on{background:var(--em2);border-color:var(--gold)}
main{max-width:780px;margin:0 auto;padding:4px 12px;animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;margin-bottom:14px;border:1px solid var(--br);transition:transform .15s}.card:hover{transform:translateY(-2px)}
.card>a{color:inherit;text-decoration:none;display:block}.card img,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--br)}
.ph{background:linear-gradient(135deg,var(--navy),var(--em2));display:flex;align-items:center;justify-content:center}.ph::after{content:"";width:34%;aspect-ratio:1;background:url(/logo.svg) center/contain no-repeat;opacity:.55}
.b{padding:12px 14px}.card h3{margin:4px 0;font-size:17px;line-height:1.7}.feat h3{font-size:21px}.card p{margin:4px 0 6px;color:var(--mu);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat{border-top:3px solid var(--gold)}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);flex-wrap:wrap}.meta .cat{color:var(--em);font-weight:700}.sp{flex:1}
.mt{display:inline-block;font-size:11px;background:rgba(212,175,55,.18);color:var(--tx);padding:0 8px;border-radius:99px;border:1px solid var(--gold)}.orig{font-size:12px;color:var(--mu);direction:ltr;text-align:left;margin:0 0 4px}
.act{display:flex;padding:0 10px 8px}.act button{font-size:19px;padding:4px 10px;border-radius:10px}.act button:hover{background:var(--bg)}
.row>a{display:flex}.row img,.row .ph{width:116px;height:auto;min-height:100px;aspect-ratio:auto;flex:none}.row .b{flex:1;min-width:0}.row h3{font-size:15px}
.sk{height:220px;border-radius:16px;margin-bottom:14px;background:linear-gradient(90deg,var(--card) 25%,var(--br) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.state{text-align:center;padding:44px 16px;color:var(--mu)}.state .em{font-size:48px}.state button,.btn.p{margin-top:12px;background:var(--em);color:#fff;padding:9px 24px;border-radius:99px}
nav.bot{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--navy);padding-bottom:env(safe-area-inset-bottom);z-index:6;border-top:2px solid var(--gold)}
nav.bot button{flex:1;padding:6px 0;color:#9FB3C9;font-size:12px;display:flex;flex-direction:column;align-items:center}nav.bot button span{font-size:21px}nav.bot button.on{color:#fff}nav.bot button.on span{filter:drop-shadow(0 0 6px var(--gold))}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:9}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:300px;max-width:85%;background:var(--card);z-index:10;transform:translateX(105%);transition:transform .28s;overflow-y:auto;padding-bottom:30px}
[dir=ltr] #drawer{transform:translateX(-105%)}#drawer.on{transform:none!important}
#drawer .hd{background:var(--navy);color:#fff;padding:22px 18px;padding-top:calc(22px + env(safe-area-inset-top));border-bottom:3px solid var(--gold)}#drawer .hd img{width:56px;border-radius:14px}#drawer .hd b{display:block;font-size:20px}#drawer .hd small{color:var(--gold)}
#drawer button{display:flex;gap:14px;width:100%;padding:11px 18px;text-align:start;align-items:center}#drawer button:hover,#drawer button.on{background:var(--bg)}#drawer button.on{color:var(--em);font-weight:700}#drawer hr{border:0;border-top:1px solid var(--br);margin:6px 0}
.set{background:var(--card);border-radius:16px;padding:6px 16px;margin-bottom:14px;border:1px solid var(--br)}.set>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--br)}.set>div:last-child{border:0}
.seg{display:flex;border:1px solid var(--br);border-radius:99px;overflow:hidden}.seg button{padding:2px 14px;font-size:14px}.seg button.on{background:var(--em);color:#fff}
.search{display:flex;gap:8px;margin:10px 0 12px}.search input{flex:1;min-width:0;padding:10px 16px;border-radius:99px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit}.search button{background:var(--em);color:#fff;padding:0 20px;border-radius:99px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000d;color:#fff;padding:6px 18px;border-radius:99px;font-size:13px;z-index:20}
h2.t{font-size:18px;margin:12px 2px}
#splash{position:fixed;inset:0;z-index:50;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .5s}#splash.off{opacity:0;pointer-events:none}
#splash img{width:112px;border-radius:26px;animation:pop .7s}#splash b{font-size:28px}#splash small{color:var(--gold);font-size:16px}@keyframes pop{from{transform:scale(.6);opacity:0}}
@media(min-width:900px){main{max-width:900px}.feed-grid{columns:2;column-gap:14px}.feed-grid .card{break-inside:avoid}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="splash"><img src="/icon-512.png" alt=""><b>Mudassir News</b><small id="spt"></small></div>
<header><button class="ic" id="menu" aria-label="Menu">☰</button>
<div class="brand"><img src="/icon-192.png" alt="Mudassir News logo"><div><b>Mudassir News</b><small id="tag"></small></div></div>
<button class="ic" id="sbtn" aria-label="Search">🔍</button><button class="ic" id="rbtn" aria-label="Refresh">⟳</button></header>
<div class="chips" id="chips"></div><main id="app"></main><nav class="bot" id="bot"></nav><div id="scrim"></div><aside id="drawer"></aside>
<script>
const API=((window.MN_CONFIG||{}).API_BASE||'').replace(/\/$/,''),CATS=['all','pakistan','world','politics','business','sports','technology','entertainment','science','health','education','weather','interesting','positive','trending'],ICON={all:'📰',pakistan:'🇵🇰',world:'🌍',politics:'🏛️',business:'💼',sports:'⚽',technology:'💻',entertainment:'🎬',science:'🔬',health:'🩺',education:'🎓',weather:'⛅',interesting:'✨',positive:'😊',trending:'🔥'};
const $=s=>document.querySelector(s),LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S={tab:'home',cat:'all',cursor:null,items:[],loading:false,err:null,q:'',ui:LS.get('ui','ur'),saved:LS.get('saved',[]),theme:LS.get('theme','auto'),last:null};
const t=()=>I18N[S.ui],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chrome(){const d=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.lang=S.ui;document.documentElement.dir=t().dir;$('#tag').textContent=$('#spt').textContent=t().tagline;$('#sbtn').ariaLabel=t().search;$('#rbtn').ariaLabel=t().refresh}
function ago(i){if(!i)return t().unknownTime;const m=Math.round((Date.now()-Date.parse(i))/6e4),a=t().ago;return m<1?a.now:m<60?a.m(m):m<1440?a.h(Math.round(m/60)):a.d(Math.round(m/1440))}
function toast(x){const e=document.createElement('div');e.className='toast';e.textContent=x;document.body.append(e);setTimeout(()=>e.remove(),1700)}
const isSaved=u=>S.saved.some(a=>a.url===u),list=fs=>fs?S.saved:S.items;
function toggleSave(i,fs){const a=list(fs)[i];if(isSaved(a.url)){S.saved=S.saved.filter(x=>x.url!==a.url);toast(t().unsaveToast)}else{S.saved.unshift(a);toast(t().saveToast)}LS.set('saved',S.saved);render()}
async function share(i,fs){const a=list(fs)[i];try{navigator.share?await navigator.share({title:a.title,url:a.url}):(await navigator.clipboard.writeText(a.url),toast(t().copied))}catch{}}
function card(a,i,kind,fs){const ur=S.ui==='ur'&&a.titleUr,title=ur?a.titleUr:a.title,sum=ur&&a.summaryUr?a.summaryUr:a.summary,rtl=(ur||a.lang==='ur')?'dir="rtl"':'dir="ltr"';
 const img=a.image?`<img loading="lazy" src="${esc(a.image)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=ph></div>'">`:'<div class="ph"></div>';
 return `<article class="card ${kind}"><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${img}<div class="b"><div class="meta"><span class="cat">${esc(t()[a.categories[0]]||a.categories[0])}</span>· <span dir="auto">${esc(a.publisher)}</span> · ${ago(a.publishedAt)}${ur?` <span class="mt">${t().mt}</span>`:''}</div>
 <h3 ${rtl}>${esc(title)}</h3>${ur?`<div class="orig" title="${t().showOriginal}">${esc(a.title)}</div>`:''}${kind==='row'?'':`<p ${rtl}>${esc(sum)}</p>`}</div></a>
 <div class="act"><span class="sp"></span><button onclick="toggleSave(${i},${!!fs})" aria-label="Bookmark">${isSaved(a.url)?'🔖':'🏷️'}</button><button onclick="share(${i},${!!fs})" aria-label="Share">↗</button></div></article>`}
async function load(reset){
 if(S.loading)return;S.loading=true;if(reset){S.items=[];S.cursor=null;S.err=null}render();
 const p=new URLSearchParams({category:S.cat,limit:20});if(S.cursor)p.set('cursor',S.cursor);if(S.q)p.set('q',S.q);if(S.ui==='ur')p.set('translate','ur');
 const key='cache:'+S.cat+S.ui;
 try{const r=await fetch(API+'/api/news?'+p,{signal:AbortSignal.timeout(25000)});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();
  S.items=S.items.concat(d.articles);S.cursor=d.nextCursor;S.last=d.lastRefresh;S.err=null;if(!S.q&&S.items.length)LS.set(key,S.items.slice(0,40))
 }catch(e){const c=!S.q&&LS.get(key,[]);if(reset&&c.length){S.items=c;S.err='offline'}else S.err=e.message}
 S.loading=false;render();hideSplash()}
function feedView(){const T=t();
 if(S.loading&&!S.items.length)return '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 if(S.err&&!S.items.length)return `<div class="state"><div class="em">⚠️</div><h3>${T.errTitle}</h3><small dir="ltr">${esc(S.err)}</small><br><button onclick="load(true)">${T.retry}</button></div>`;
 if(!S.items.length)return `<div class="state"><div class="em">📭</div><h3>${S.q?T.noResults+' “'+esc(S.q)+'”':T.emptyTitle}</h3><p>${S.q?'':T.emptyHint}</p><button onclick="load(true)">${T.refresh}</button></div>`;
 const off=S.err==='offline'?`<div class="state" style="padding:6px">📴 ${T.offline}</div>`:'',f=S.q?'':card(S.items[0],0,'feat'),
 rest=S.items.slice(S.q?0:1).map((a,i)=>card(a,i+(S.q?0:1),i%6===0&&!S.q?'':'row')).join('');
 return off+f+'<div class="feed-grid">'+rest+'</div>'+(S.cursor?`<div class="state" style="padding:8px"><button onclick="load()">${S.loading?T.loading:T.loadMore}</button></div>`:'')}
function render(){const T=t();
 $('#chips').style.display=S.tab==='home'?'flex':'none';
 $('#chips').innerHTML=CATS.map(k=>`<button class="chip ${k==='all'?'all':''} ${S.cat===k?'on':''}" onclick="setCat('${k}')">${ICON[k]} ${T[k]}</button>`).join('');
 $('#bot').innerHTML=[['home','🏠',T.home],['explore','🧭',T.explore],['saved','🔖',T.saved],['settings','⚙️',T.settings]].map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
 const a=$('#app');
 if(S.tab==='home')a.innerHTML=feedView();
 else if(S.tab==='explore')a.innerHTML=`<form class="search" onsubmit="event.preventDefault();S.q=this.q.value.trim().slice(0,100);S.q?load(true):render()"><input name="q" type="search" placeholder="${T.search}" value="${esc(S.q)}"><button>${T.searchBtn}</button></form>`+(S.q?feedView():`<h2 class="t">${T.browse}</h2><div style="display:flex;flex-wrap:wrap;gap:8px">${CATS.slice(1).map(k=>`<button class="chip" onclick="S.tab='home';setCat('${k}')">${ICON[k]} ${T[k]}</button>`).join('')}</div>`);
 else if(S.tab==='saved')a.innerHTML=S.saved.length?`<h2 class="t">${T.bookmarks}</h2>`+S.saved.map((x,i)=>card(x,i,'row',true)).join(''):`<div class="state"><div class="em">🔖</div><h3>${T.noSaved}</h3><p>${T.noSavedHint}</p></div>`;
 else a.innerHTML=`<h2 class="t">${T.settings}</h2><div class="set"><div>${T.language}<div class="seg">${['ur','en'].map(l=>`<button class="${S.ui===l?'on':''}" onclick="setUi('${l}')">${l==='ur'?'اردو':'English'}</button>`).join('')}</div></div><div>${T.theme}<div class="seg">${[['auto',T.themeAuto],['light',T.themeLight],['dark',T.themeDark]].map(([k,l])=>`<button class="${S.theme===k?'on':''}" onclick="S.theme='${k}';LS.set('theme','${k}');chrome();render()">${l}</button>`).join('')}</div></div><div>${T.lastRefresh}<span>${S.last?ago(S.last):'—'}</span></div><div>${T.bookmarks}<button class="chip" onclick="S.saved=[];LS.set('saved',[]);render()">${T.clear}</button></div></div><div class="set"><div style="display:block"><b>${T.about}</b><p style="color:var(--mu);font-size:14px">${T.aboutText}</p></div></div>`;
 drawer()}
function setUi(l){S.ui=l;LS.set('ui',l);chrome();S.tab==='home'||S.q?load(true):render()}
function setCat(c){S.cat=c;S.q='';S.tab='home';closeDrawer();load(true);scrollTo(0,0);setTimeout(()=>document.querySelector('.chip.on')?.scrollIntoView({inline:'center',block:'nearest'}),50)}
function go(k){S.tab=k;closeDrawer();if(k==='home')S.q='';k==='home'?load(true):render();scrollTo(0,0)}
function drawer(){const T=t();$('#drawer').innerHTML=`<div class="hd"><img src="/icon-192.png" alt=""><b>Mudassir News</b><small>${T.tagline}</small></div>`+CATS.map(k=>`<button class="${S.tab==='home'&&S.cat===k?'on':''}" data-k="${k}"><span>${ICON[k]}</span>${T[k]}</button>`).join('')+`<hr><button data-k="@saved"><span>🔖</span>${T.bookmarks}</button><button data-k="@settings"><span>🌐</span>${T.language} / ${T.theme}</button><button data-k="@mail"><span>✉️</span>${T.feedback}</button><hr><p style="padding:4px 18px;color:var(--mu);font-size:12px">${T.menuNote}</p>`}
$('#drawer').onclick=e=>{const k=e.target.closest('button')?.dataset.k;if(!k)return;if(k==='@mail')location.href='mailto:feedback@example.com?subject=Mudassir%20News';else if(k[0]==='@')go(k.slice(1));else setCat(k)};
const openDrawer=()=>{$('#drawer').classList.add('on');$('#scrim').classList.add('on')},closeDrawer=()=>{$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')};
$('#menu').onclick=openDrawer;$('#scrim').onclick=closeDrawer;$('#sbtn').onclick=()=>go('explore');$('#rbtn').onclick=()=>S.tab==='home'||S.q?load(true):go('home');
let y0=null;addEventListener('touchstart',e=>{y0=scrollY===0?e.touches[0].clientY:null},{passive:true});addEventListener('touchend',e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>90&&S.tab==='home')load(true);y0=null});
setInterval(()=>{if(!document.hidden&&S.tab==='home'&&!S.loading)load(true)},5*6e4);addEventListener('online',()=>S.tab==='home'&&load(true));
let splashT=Date.now();function hideSplash(){setTimeout(()=>{$('#splash').classList.add('off');setTimeout(()=>$('#splash').remove(),600)},Math.max(0,1200-(Date.now()-splashT)))}setTimeout(hideSplash,6000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
chrome();render();load(true);
</script></body></html>
